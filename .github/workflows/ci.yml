name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: 'npm'

      - run: npm ci
      - run: npx nx format:check --base=origin/main
      - run: npx nx run-many -t test build

  # Database, edge functions and the Supabase repositories against a local Supabase in Docker.
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: 'npm'

      - run: npm ci
      - run: npx supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor
      - name: Row-level security (pgTAP)
        run: npx supabase test db
      - name: Generated database types are current
        run: npm run db:types && git diff --exit-code libs/backend/supabase/src/lib/database.types.ts
      - name: Edge functions (Deno)
        run: npm run functions:test
      - name: Supabase repositories
        run: npm run test:supabase
