name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: 'npm'

      - run: npm ci
      - run: npx nx format:check --base=origin/main
      - run: npx nx run-many -t test build
